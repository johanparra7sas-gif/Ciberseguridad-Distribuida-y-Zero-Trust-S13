
events {}

http {
    server {
        listen 8443 ssl;
        server_name ingress.metromio.net;

        # Permitir exclusivamente TLS 1.3
        ssl_protocols TLSv1.3;

        # Certificado y llave privada del servidor
        ssl_certificate /etc/nginx/pki/ingress.crt;
        ssl_certificate_key /etc/nginx/pki/ingress.key;

        # CA utilizada para verificar los certificados
        # que presentan los buses
        ssl_client_certificate /etc/nginx/pki/ca.crt;

        # Exigir certificado de cliente
        ssl_verify_client on;

        # Profundidad máxima de verificación
        ssl_verify_depth 2;

        # Endpoint de telemetría MetroMIO
        location /telemetria {
            default_type application/json;

            return 200 '{"estado":"aceptado","cliente":"$ssl_client_s_dn","verificacion":"$ssl_client_verify"}';
        }
    }
}
