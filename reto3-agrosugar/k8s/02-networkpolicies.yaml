

# 1. Denegar todas las entradas y salidas
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: agrosugar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 2. Permitir DNS hacia CoreDNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: agrosugar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 3. El broker acepta solo sensores
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mqtt-from-sensors
  namespace: agrosugar
spec:
  podSelector:
    matchLabels:
      app: mqtt-broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: sensor-node
      ports:
        - protocol: TCP
          port: 1883

---
# 4. Los sensores solo salen hacia MQTT
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sensors-egress-mqtt
  namespace: agrosugar
spec:
  podSelector:
    matchLabels:
      role: sensor-node
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mqtt-broker
      ports:
        - protocol: TCP
          port: 1883

